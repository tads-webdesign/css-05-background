<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 01 - background-color</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f0f0f0;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .caixa-azul {
            background-color: blue;
            padding: 20px;
            margin: 10px;
            color: white;
        }

        .caixa-rgb {
            background-color: rgb(255, 100, 50);
            padding: 20px;
            margin: 10px;
            color: white;
        }

        .caixa-rgba {
            background-color: rgba(0, 150, 0, 0.5);
            padding: 20px;
            margin: 10px;
            color: white;
        }

        .caixa-hex {
            background-color: #ff6b6b;
            padding: 20px;
            margin: 10px;
            color: white;
        }
    </style>
</head>

<body>
    <header>
        <h1>Exemplo: background-color</h1>
    </header>
    <main>
        <div class="caixa-azul">
            Fundo azul (nome da cor)
        </div>
        <div class="caixa-rgb">
            Fundo RGB: rgb(255, 100, 50)
        </div>
        <div class="caixa-rgba">
            Fundo RGBA com transparência: rgba(0, 150, 0, 0.5)
        </div>
        <div class="caixa-hex">
            Fundo Hexadecimal: #ff6b6b
        </div>
    </main>
</body>

</html>
